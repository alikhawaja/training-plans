name: kafka-training-cluster

x-broker-environment: &broker-environment
  CLUSTER_ID: OTM2RkY3QzU1QjM0NEE1Rg
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-1:9093,2@broker-2:9093,3@broker-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

x-broker: &broker
  image: apache/kafka:4.1.2
  healthcheck:
    test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s

services:
  broker-1:
    <<: *broker
    hostname: broker-1
    ports:
      - "127.0.0.1:19092:9094"
    environment:
      <<: *broker-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:9092,EXTERNAL://localhost:19092
    volumes:
      - broker-1-data:/var/lib/kafka/data
  broker-2:
    <<: *broker
    hostname: broker-2
    ports:
      - "127.0.0.1:29092:9094"
    environment:
      <<: *broker-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:9092,EXTERNAL://localhost:29092
    volumes:
      - broker-2-data:/var/lib/kafka/data
  broker-3:
    <<: *broker
    hostname: broker-3
    ports:
      - "127.0.0.1:39092:9094"
    environment:
      <<: *broker-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-3:9092,EXTERNAL://localhost:39092
    volumes:
      - broker-3-data:/var/lib/kafka/data

volumes:
  broker-1-data:
  broker-2-data:
  broker-3-data:
