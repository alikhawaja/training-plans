name: rest-api-training

services:
  api:
    build:
      context: ../..
      dockerfile: rest-apis/infrastructure/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TRAINING_API_TOKEN: workshop-demo-token
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  api-data:
